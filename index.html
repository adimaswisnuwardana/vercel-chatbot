<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chatbot</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <h2><i class="fas fa-comment-dots"></i> Chats</h2>
          <button id="new-chat-btn" class="btn btn-primary" title="Start new chat">
            <i class="fas fa-plus"></i> New Chat
          </button>
        </div>
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="search-chat" placeholder="Search chats..." />
        </div>
        <div id="chat-list" class="chat-list"></div>
        <div class="sidebar-footer">
          <span id="chat-count" class="chat-count">0 chats</span>
          <button id="clear-all-btn" class="btn btn-icon" title="Clear all chats">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="main-content">
        <!-- Top Controls -->
        <header class="chat-header">
          <button id="sidebar-toggle" class="btn btn-icon sidebar-toggle" title="Toggle sidebar">
            <i class="fas fa-bars"></i>
          </button>
          <h1 class="chat-title">AI Chatbot</h1>
        </header>

        <!-- Messages Area -->
        <div id="messages-container" class="messages-container">
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-icon">
              <i class="fas fa-robot"></i>
            </div>
            <h1>AI Chatbot</h1>
            <p>Select a model and start a conversation. I can help with questions, analyze images, and more!</p>
            <div class="quick-actions">
              <button class="quick-action-btn" data-prompt="Explain quantum computing in simple terms">
                <i class="fas fa-atom"></i> Science
              </button>
              <button class="quick-action-btn" data-prompt="Write a Python function to sort a list">
                <i class="fas fa-code"></i> Code
              </button>
              <button class="quick-action-btn" data-prompt="Summarize the benefits of meditation">
                <i class="fas fa-spa"></i> Wellness
              </button>
              <button class="quick-action-btn" data-prompt="Create a simple recipe for pasta">
                <i class="fas fa-utensils"></i> Recipe
              </button>
            </div>
          </div>
          <div id="messages" class="messages" style="display:none;"></div>
        </div>

        <!-- Input Area -->
        <footer class="input-area">
          <div id="file-preview" class="file-preview" style="display:none;">
            <div class="file-preview-content">
              <i class="fas fa-file"></i>
              <span id="file-name"></span>
              <button id="remove-file" class="btn btn-icon" title="Remove file">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          <div class="input-wrapper">
            <button id="attach-btn" class="btn btn-icon" title="Attach file">
              <i class="fas fa-paperclip"></i>
            </button>
            <input type="file" id="file-input" accept="image/*,.pdf,.txt,.md,.doc,.docx" multiple style="display:none" />
            <textarea id="message-input" class="message-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" class="btn btn-send" title="Send message" disabled>
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
          <div class="input-options">
            <div class="control-group">
              <label for="model-select"><i class="fas fa-brain"></i> Model</label>
              <select id="model-select" class="select-control"></select>
            </div>
            <div class="control-group">
              <label for="effort-select"><i class="fas fa-sliders-h"></i> Thinking</label>
              <select id="effort-select" class="select-control">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
          </div>
          <div class="input-footer">
            <span class="typing-indicator" id="typing-indicator" style="display:none;">
              <i class="fas fa-circle-notch fa-spin"></i> AI is thinking...
            </span>
          </div>
        </footer>
      </main>
    </div>

    <!-- Modal for Delete Confirmation -->
    <div id="modal-overlay" class="modal-overlay" style="display:none;">
      <div class="modal">
        <h3>Clear All Chats?</h3>
        <p>This will permanently delete all your chat history.</p>
        <div class="modal-actions">
          <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
          <button id="modal-confirm" class="btn btn-danger">Delete All</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
